[project]
name = "b123d-print"
version = "0.3.4"
description = "Design, check and export 3D-printable parts with build123d, from any LLM via MCP"
readme = "README.md"
license = "MIT"
authors = [{ name = "KD5RYN" }, { name = "b123d-print contributors" }]
license-files = ["LICENSE", "THIRD_PARTY.md", "src/b123d_print/data/viewer/three-LICENSE.txt"]
keywords = ["cad", "3d-printing", "build123d", "mcp", "llm"]
requires-python = "==3.12.*"
dependencies = [
    "bd_warehouse==0.4.0",  # threads, fasteners, holes, gears, V-slot parts for part scripts (Apache-2.0)
    "build123d==0.13.0",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "py_gearworks==0.0.24",  # involute spur, helical, herringbone, bevel gears and racks for part scripts (Apache-2.0)
    "scipy==1.18.1",  # already required by build123d; compare uses its k-d tree
]

[project.urls]
Documentation = "https://kd5ryn.github.io/b123d-print/"
Source = "https://github.com/KD5RYN/b123d-print"
Issues = "https://github.com/KD5RYN/b123d-print/issues"
Changelog = "https://github.com/KD5RYN/b123d-print/blob/main/CHANGELOG.md"
Releases = "https://github.com/KD5RYN/b123d-print/releases"

[project.scripts]
b123d-print = "b123d_print.cli:main"
b123d-print-mcp = "b123d_print.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# the eval runner's Claude adapter (eval/, repo only; never a runtime dependency)
eval = ["anthropic==1.14.0"]
dev = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.3",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
]

[tool.uv.build-backend]
# generated previews/STEP/STL next to the bundled examples stay out of the packages
source-exclude = ["**/out/**", "**/__pycache__/**"]
wheel-exclude = ["**/out/**", "**/__pycache__/**"]
