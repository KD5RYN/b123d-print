# Reference corpus for the agent eval (eval/run.py). Model files are NOT in the repository:
# `uv run python eval/run.py fetch` downloads them into .b123d-eval/cache/ and checks sha256.
#
# Rules for entries: permissive license only (CC0, CC-BY, CC-BY-SA, MIT, BSD, Apache-2.0,
# Unlicense; nothing NonCommercial or NoDerivatives), verified at the pinned commit
# (license_url); a direct download pinned to a commit; the author credited as the project
# credits them; description and dimensions as a user would give them, measured from the file.
#
# All files downloaded 2026-10-17, measured from the mesh with numpy (binary/ASCII STL parser,
# vertex welding at 1e-4 mm, signed-tetrahedron volume, planar sections chained into loops).
# Coordinates in `dimensions` are in the file's own frame unless stated otherwise.

