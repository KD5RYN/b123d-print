# b123d-print MCP server as a network service (Streamable HTTP at /mcp, bearer token required).
#
#   mkdir -p parts && sudo chown 1000:1000 parts        # the image runs as uid 1000 ("cad")
#   python3 -c 'import secrets; print("B123D_PRINT_TOKEN=" + secrets.token_urlsafe(32))' > b123d-print.env
#   chmod 600 b123d-print.env
#   docker compose up -d && docker compose ps          # STATUS shows (healthy)
#
# Clients: http://<this-host>:8000/mcp?workspace=<agent-name>, header "Authorization: Bearer <token>".
# Every client should pick its own workspace name; its parts land in ./parts/workspaces/<name>/.
# The port is published on localhost only: put a TLS reverse proxy in front (see the Caddy
# example below), or change it to "8000:8000" on a trusted network.
services:
  b123d-print:
    image: ghcr.io/kd5ryn/b123d-print-mcp:latest   # or build: .. (this repo)
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./parts:/work
    env_file: b123d-print.env                      # B123D_PRINT_TOKEN=...
    environment:
      B123D_PRINT_TRANSPORT: http
      B123D_PRINT_MAX_BUILDS: "2"                  # build processes at once, all clients together
      B123D_PRINT_TIMEOUT: "120"                   # seconds per build
      B123D_PRINT_SHUTDOWN_GRACE: "30"             # on stop: let running calls finish this long
      # B123D_PRINT_ALLOWED_HOSTS: "cad.example.com,cad.example.com:*"   # Host check behind a proxy
    stop_grace_period: 45s                         # > B123D_PRINT_SHUTDOWN_GRACE
    # the image's HEALTHCHECK probes /health

  # Optional TLS in front (Caddy gets a certificate itself for a public name; for an internal
  # name, use `tls /certs/fullchain.pem /certs/privkey.pem` and mount your certificate):
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["443:443"]
  #   command: caddy reverse-proxy --from cad.example.com --to b123d-print:8000
  #   volumes: [caddy_data:/data]
# volumes:
#   caddy_data:
