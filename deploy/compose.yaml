# b123d-print MCP server as a network service: Streamable HTTP at /mcp, named bearer tokens.
#
# Two containers share the parts folder: `b123d-print` answers HTTP and has a network but runs no
# part scripts; `worker` runs the model-written part scripts and has NO network (network_mode:
# none). They talk only through a job folder on the shared volume.
#
# Needs the image >= 0.2.0 (HTTP mode). To build it from this repo instead:
# B123D_PRINT_IMAGE=b123d-print-mcp, `docker build -t b123d-print-mcp ..`.
#
#   mkdir -p parts config && sudo chown 1000:1000 parts config   # the image runs as uid 1000 ("cad")
#   echo "B123D_PRINT_PUBLIC_URL=https://cad.example.com" >> .env  # the address clients use (optional)
#   docker compose up -d && docker compose ps                    # both (healthy)
#
# Connect an AI (one token per agent or tool; prints the token ONCE, with the client config):
#   docker compose run --rm -T b123d-print token add claude-laptop        # workspace "claude-laptop"
#   docker compose run --rm -T b123d-print token add eval --workspace 'eval-*'
#   docker compose run --rm -T b123d-print token list                     # token revoke <name>: no restart
#
# Settings in a .env file next to this one (no need to edit this file): B123D_PRINT_IMAGE,
# B123D_PRINT_PUBLIC_URL, B123D_PRINT_LISTEN (default 127.0.0.1:8000: put a TLS reverse proxy in
# front, e.g. the Caddy block below; 8000 on a trusted network), B123D_PRINT_PARTS,
# B123D_PRINT_CONFIG, B123D_PRINT_UID/GID, B123D_PRINT_MAX_BUILDS, B123D_PRINT_RETENTION_DAYS (default 30:
# a workspace nobody used for that many days is removed; 0 = never), B123D_PRINT_TIMEOUT (default 240 s
# per build), B123D_PRINT_CHECK_TIMEOUT (default 300 s per check), B123D_PRINT_QUICK_SLOTS (default 1),
# B123D_PRINT_CLIENT_JOBS (default 4), B123D_PRINT_MAX_UPLOADS (default 8), B123D_PRINT_CLIENT_UPLOADS
# (default 2), B123D_PRINT_MAX_MEMORY (default 2g per build),
# B123D_PRINT_WORKER_MEMORY (default 6g: the whole worker container).
#
# Sharing between clients (tokens): builds run at most MAX_BUILDS at once; QUICK_SLOTS of those only
# take quick calls (measure, section, faces, edges, hardware_list), so they never wait behind other
# clients' long builds; a free slot goes to the client with the fewest builds running (round-robin);
# a client with CLIENT_JOBS calls running and waiting is refused until one finishes.
# Memory: each build may use MAX_MEMORY, and the worker container WORKER_MEMORY in all. Keep
# WORKER_MEMORY >= MAX_BUILDS x MAX_MEMORY + 1g, so a runaway build fails with "the build used more
# than 2 GB of memory" instead of the kernel's OOM killer stopping other clients' builds.
x-common: &common
  image: ${B123D_PRINT_IMAGE:-ghcr.io/kd5ryn/b123d-print-mcp:latest}
  restart: unless-stopped
  user: "${B123D_PRINT_UID:-1000}:${B123D_PRINT_GID:-1000}"
  volumes:
    - ${B123D_PRINT_PARTS:-./parts}:/work

services:
  b123d-print:
    <<: *common
    ports:
      - "${B123D_PRINT_LISTEN:-127.0.0.1:8000}:8000"
    volumes:
      - ${B123D_PRINT_PARTS:-./parts}:/work
      - ${B123D_PRINT_CONFIG:-./config}:/config        # tokens.toml: only token hashes; not visible to the worker
    environment:
      B123D_PRINT_TRANSPORT: http
      B123D_PRINT_TOKENS_FILE: /config/tokens.toml
      B123D_PRINT_JOB_QUEUE: /work/.b123d-print/jobs   # builds go to the worker below
      B123D_PRINT_MAX_BUILDS: ${B123D_PRINT_MAX_BUILDS:-2}   # builds at once, all clients together
      B123D_PRINT_QUICK_SLOTS: ${B123D_PRINT_QUICK_SLOTS:-1}   # of those, kept for quick calls (0 = none)
      B123D_PRINT_CLIENT_JOBS: ${B123D_PRINT_CLIENT_JOBS:-4}   # calls running + waiting per token (0 = no cap)
      B123D_PRINT_MAX_UPLOADS: ${B123D_PRINT_MAX_UPLOADS:-8}         # signed-link uploads at once, all tokens (0 = no cap)
      B123D_PRINT_CLIENT_UPLOADS: ${B123D_PRINT_CLIENT_UPLOADS:-2}   # signed-link uploads at once per token (0 = no cap)
      B123D_PRINT_MAX_MEMORY: ${B123D_PRINT_MAX_MEMORY:-2g}    # per build: enforced by the worker, reported here
      B123D_PRINT_TIMEOUT: ${B123D_PRINT_TIMEOUT:-240}               # seconds per build, render, export
      B123D_PRINT_CHECK_TIMEOUT: ${B123D_PRINT_CHECK_TIMEOUT:-300}   # seconds per check (returns what it has, near the end)
      B123D_PRINT_SHUTDOWN_GRACE: "30"                 # on stop: let running calls finish this long
      # the server is a workbench, not storage: a workspace nobody used for this many days is
      # removed (checked hourly, never while in use; clients bring parts home with download_part)
      B123D_PRINT_RETENTION_DAYS: ${B123D_PRINT_RETENTION_DAYS:-30}   # 0 = never
      # the address clients use (behind a reverse proxy: its https URL), for download links and
      # the config `token add` prints; empty: taken from each request
      B123D_PRINT_PUBLIC_URL: ${B123D_PRINT_PUBLIC_URL:-}
    stop_grace_period: 45s                             # > B123D_PRINT_SHUTDOWN_GRACE
    # the image's HEALTHCHECK probes /health (503 while the worker is down)

  worker:
    <<: *common
    network_mode: none                                 # part scripts get no network at all
    command: ["worker", "--queue", "/work/.b123d-print/jobs"]
    environment:
      B123D_PRINT_MAX_BUILDS: ${B123D_PRINT_MAX_BUILDS:-2}
      # memory per build (RLIMIT_DATA, set before bubblewrap starts, so a job cannot raise it); a
      # build over it fails with a plain message and the other builds go on; 0 = no limit
      B123D_PRINT_MAX_MEMORY: ${B123D_PRINT_MAX_MEMORY:-2g}
      # "bubblewrap" REQUIRES the sandbox: each job runs in its own bubblewrap mount namespace that
      # binds only its workspace's part folder and a scratch folder, so one client's script cannot
      # see other workspaces, the job queue or the shared config on the volume. If bubblewrap cannot
      # start (no unprivileged user namespaces on the host), the worker refuses every job and reports
      # unhealthy instead of silently running with the audit hook only. On a host that cannot provide
      # user namespaces (e.g. a nested LXC container), set this to "none" to accept the audit hook
      # alone (not an isolation boundary) or give each client its own deployment.
      B123D_PRINT_SANDBOX: bubblewrap
    security_opt:
      # a custom seccomp profile: allow-by-default with a deny list, unlike Docker's default
      # (deny-by-default allowlist), because bubblewrap needs the namespace and mount syscalls
      # Docker's default blocks; it still denies the privileged syscalls neither a build nor
      # bubblewrap uses (see deploy/seccomp-bwrap.json)
      - seccomp=./seccomp-bwrap.json
      # unprivileged user namespaces also need AppArmor not to block them (Ubuntu 23.10+ restricts
      # them by default); the worker has no network regardless (network_mode: none)
      - apparmor:unconfined
    # the backstop for what the per-build limit does not count (several processes, the page cache):
    # the kernel stops builds in this container only, never the front or the host
    mem_limit: ${B123D_PRINT_WORKER_MEMORY:-6g}
    pids_limit: 1024                                   # builds, their threads and bubblewrap
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "b123d-print-mcp", "worker", "--queue", "/work/.b123d-print/jobs", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      start_interval: 2s

  # Optional TLS in front (Caddy gets a certificate itself for a public name; for an internal
  # name, use `tls /certs/fullchain.pem /certs/privkey.pem` and mount your certificate). With it,
  # set B123D_PRINT_PUBLIC_URL above to https://cad.example.com.
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["443:443"]
  #   command: caddy reverse-proxy --from cad.example.com --to b123d-print:8000
  #   volumes: [caddy_data:/data]
# volumes:
#   caddy_data:
