# b123d-print MCP server as a network service: Streamable HTTP at /mcp, named bearer tokens.
#
# Two containers share the parts folder: `b123d-print` answers HTTP and has a network but runs no
# part scripts; `worker` runs the model-written part scripts and has NO network (network_mode:
# none). They talk only through a job folder on the shared volume.
#
# Needs the image >= 0.2.0 (HTTP mode). To build it from this repo instead:
# B123D_PRINT_IMAGE=b123d-print-mcp, `docker build -t b123d-print-mcp ..`.
#
#   mkdir -p parts config && sudo chown 1000:1000 parts config   # the image runs as uid 1000 ("cad")
#   echo "B123D_PRINT_PUBLIC_URL=https://cad.example.com" >> .env  # the address clients use (optional)
#   docker compose up -d && docker compose ps                    # both (healthy)
#
# Connect an AI (one token per agent or tool; prints the token ONCE, with the client config):
#   docker compose run --rm -T b123d-print token add claude-laptop        # workspace "claude-laptop"
#   docker compose run --rm -T b123d-print token add eval --workspace 'eval-*'
#   docker compose run --rm -T b123d-print token list                     # token revoke <name>: no restart
#
# Settings in a .env file next to this one (no need to edit this file): B123D_PRINT_IMAGE,
# B123D_PRINT_PUBLIC_URL, B123D_PRINT_LISTEN (default 127.0.0.1:8000: put a TLS reverse proxy in
# front, e.g. the Caddy block below; 8000 on a trusted network), B123D_PRINT_PARTS,
# B123D_PRINT_CONFIG, B123D_PRINT_UID/GID, B123D_PRINT_MAX_BUILDS, B123D_PRINT_RETENTION_DAYS (default 30:
# a workspace nobody used for that many days is removed; 0 = never), B123D_PRINT_TIMEOUT (default 240 s
# per build), B123D_PRINT_CHECK_TIMEOUT (default 300 s per check).
x-common: &common
  image: ${B123D_PRINT_IMAGE:-ghcr.io/kd5ryn/b123d-print-mcp:latest}
  restart: unless-stopped
  user: "${B123D_PRINT_UID:-1000}:${B123D_PRINT_GID:-1000}"
  volumes:
    - ${B123D_PRINT_PARTS:-./parts}:/work

services:
  b123d-print:
    <<: *common
    ports:
      - "${B123D_PRINT_LISTEN:-127.0.0.1:8000}:8000"
    volumes:
      - ${B123D_PRINT_PARTS:-./parts}:/work
      - ${B123D_PRINT_CONFIG:-./config}:/config        # tokens.toml: only token hashes; not visible to the worker
    environment:
      B123D_PRINT_TRANSPORT: http
      B123D_PRINT_TOKENS_FILE: /config/tokens.toml
      B123D_PRINT_JOB_QUEUE: /work/.b123d-print/jobs   # builds go to the worker below
      B123D_PRINT_MAX_BUILDS: ${B123D_PRINT_MAX_BUILDS:-2}   # builds at once, all clients together
      B123D_PRINT_TIMEOUT: ${B123D_PRINT_TIMEOUT:-240}               # seconds per build, render, export
      B123D_PRINT_CHECK_TIMEOUT: ${B123D_PRINT_CHECK_TIMEOUT:-300}   # seconds per check (returns what it has, near the end)
      B123D_PRINT_SHUTDOWN_GRACE: "30"                 # on stop: let running calls finish this long
      # the server is a workbench, not storage: a workspace nobody used for this many days is
      # removed (checked hourly, never while in use; clients bring parts home with download_part)
      B123D_PRINT_RETENTION_DAYS: ${B123D_PRINT_RETENTION_DAYS:-30}   # 0 = never
      # the address clients use (behind a reverse proxy: its https URL), for download links and
      # the config `token add` prints; empty: taken from each request
      B123D_PRINT_PUBLIC_URL: ${B123D_PRINT_PUBLIC_URL:-}
    stop_grace_period: 45s                             # > B123D_PRINT_SHUTDOWN_GRACE
    # the image's HEALTHCHECK probes /health (503 while the worker is down)

  worker:
    <<: *common
    network_mode: none                                 # part scripts get no network at all
    command: ["worker", "--queue", "/work/.b123d-print/jobs"]
    environment:
      B123D_PRINT_MAX_BUILDS: ${B123D_PRINT_MAX_BUILDS:-2}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "b123d-print-mcp", "worker", "--queue", "/work/.b123d-print/jobs", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      start_interval: 2s

  # Optional TLS in front (Caddy gets a certificate itself for a public name; for an internal
  # name, use `tls /certs/fullchain.pem /certs/privkey.pem` and mount your certificate). With it,
  # set B123D_PRINT_PUBLIC_URL above to https://cad.example.com.
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["443:443"]
  #   command: caddy reverse-proxy --from cad.example.com --to b123d-print:8000
  #   volumes: [caddy_data:/data]
# volumes:
#   caddy_data:
