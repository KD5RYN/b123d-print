# Locks the MCP server this plugin runs (.mcp.json: uvx b123d-print==<version> mcp): exact versions and
# hashes for the Claude plugin directory. Bump after each PyPI release: set the version here and in
# .mcp.json, then `uv lock --directory plugin`.
[project]
name = "b123d-print-plugin"
version = "0.3.2"
requires-python = "==3.12.*"
dependencies = ["b123d-print==0.3.2"]

[tool.uv]
package = false
