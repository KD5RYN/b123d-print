# Locks the MCP server this plugin runs (.mcp.json: uv run --frozen --project ${CLAUDE_PLUGIN_ROOT}),
# so every install gets the same versions with checked hashes. Bump after each PyPI release:
# set the version below, then `uv lock --directory plugin`.
[project]
name = "b123d-print-plugin"
version = "0.3.2"
requires-python = "==3.12.*"
dependencies = ["b123d-print==0.3.2"]

[tool.uv]
package = false
