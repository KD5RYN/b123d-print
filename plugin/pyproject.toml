# Locks the MCP server this plugin runs (.mcp.json: uvx b123d-print==<version> mcp): exact versions and
# hashes for the Claude plugin directory. After each PyPI release, release.yml's plugin-pin job opens a
# PR that sets the version here and in .mcp.json and runs `uv lock --directory plugin`.
[project]
name = "b123d-print-plugin"
version = "0.3.14"
requires-python = "==3.12.*"
dependencies = ["b123d-print==0.3.14"]

[tool.uv]
package = false
