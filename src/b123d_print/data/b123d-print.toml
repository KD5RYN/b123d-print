# b123d-print workspace settings. Values here override your user config
# (~/.config/b123d-print/config.toml); env vars (B123D_PRINT_HOLE_COMP, ...) override both.

[workspace]
parts_dir = "parts"

# Printer nicknames, for two of the same model: each keeps its own calibration.
# [printers]
# p2s-garage = "bambu_lab_p2s"

# Measured per printer (or nickname) + material, written by save_setup on a shared server or
# `b123d-print printer calibrate --workspace`; "<printer>/any" holds values for every material.
# [calibration."bambu_lab_p2s/pla"]
# hole_comp = 0.3

[print]
# Printer-specific: usually better in the user config or [calibration] above (a value here is used
# for every printer). Measure it with the hole_coupon example.
# hole_comp = 0.0     # mm added to hole diameters when cutting
# hole_comp_h = 0.0   # the same for horizontal holes (default: hole_comp)
# clearance = 0.2     # mm per side between mating parts that slide (the default fit)
# press_fit = 0.05    # mm per side, pressed together
# free_fit = 0.3      # mm per side, turns or moves freely
# pip_clearance = 0.3 # mm between parts printed in place
# min_wall = 0.8      # mm; Wall checks fail below this unless they set their own minimum
# max_overhang = 45   # deg from vertical
# max_bridge = 10     # mm; longer bridges warn
# max_triangles = 50000  # import_model refuses meshes with more triangles (simplify them first)
# formats = ["step", "stl", "3mf", "png"]   # what export writes; e.g. ["3mf", "png"]
# style = "functional"  # design review style for parts without STYLE: functional, modern, least_cost, rugged, soft, structural
# filament_price = 25  # per kg; design_metrics then shows a cost
# print_flow = 10      # mm^3/s for the rough print-time estimate (standard hotend 8-12, high-flow 20+)
# tip_speed = 200      # mm/s, your slicer's fastest print speed: the tip-over check scales with it; 0 turns it off
# supports = "tree"    # your support style for the print sheet: none, auto, build_plate_only, tree (a part's PRINT wins)
# walls = 3            # your wall count (perimeters) for the print sheet and the estimates (a part's PRINT wins)
# infill = 20          # your infill percent for the print sheet and the estimates (a part's PRINT wins)
