# Weekly update PRs for the pinned dependencies, the GitHub Actions and the Docker base image.
# CI runs on each PR; nothing merges without review. Minor/patch updates are grouped so there is
# one PR per ecosystem per week instead of one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
