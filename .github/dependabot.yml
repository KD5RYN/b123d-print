# Weekly update PRs for the pinned dependencies, the GitHub Actions (pinned by commit SHA) and the
# Docker base images (pinned by digest).
# CI runs on each PR; nothing merges without review. Minor/patch updates are grouped so there is
# one PR per ecosystem per week instead of one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # the project pins Python 3.12 (requires-python ==3.12.*); only take 3.12.x base-image updates
      - dependency-name: python
        versions: [">=3.13"]
