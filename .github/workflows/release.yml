name: Release

# Tag vX.Y.Z (matching pyproject.toml) to publish the PyPI package and the Docker image.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi  # PyPI trusted publisher: owner/repo + workflow release.yml + environment pypi
    permissions:
      id-token: write  # OIDC: no PyPI token stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: The changelog has a dated section for this version
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/b123d-print-mcp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    # the GitHub Release page for the tag, text = this version's CHANGELOG.md section;
    # also creates any missing pages for older tags
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_notes.py --backfill

  mcp-registry:
    # the MCP Registry entry (io.github.KD5RYN/b123d-print) from server.json; after PyPI, because
    # the registry checks the mcp-name line in the package's README on PyPI. GitHub OIDC: no token stored.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: "1.8.1"
      # sha256 of mcp-publisher_linux_amd64.tar.gz, from registry_1.8.1_checksums.txt of that release
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher && rm mcp-publisher.tar.gz
      - name: server.json is this version
        run: test "$(jq -r .version server.json)" = "${GITHUB_REF_NAME#v}"
      - run: ./mcp-publisher login github-oidc
      - name: Publish (retried while PyPI's API catches up with the upload; the registry reads the package from it)
        run: |
          listed() {
            curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.KD5RYN/b123d-print" |
              jq -e --arg v "${GITHUB_REF_NAME#v}" '[.servers[].server.version] | index($v) != null' > /dev/null
          }
          listed && { echo "already listed (a re-run)"; exit 0; }
          for i in $(seq 10); do
            ./mcp-publisher publish && break
            [ "$i" = 10 ] && exit 1
            sleep 30
          done
          # the registry's search lags the publish by a little: give it a few minutes
          for i in $(seq 12); do listed && exit 0; sleep 15; done
          echo "published, but the registry's search does not list it yet"; exit 1

  plugin-pin:
    # a PR that moves the Claude plugin to the version just uploaded: the pin and version in
    # plugin/pyproject.toml, the pin in plugin/.mcp.json, and plugin/uv.lock
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set the pin
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version = \".*\"/version = \"$v\"/; s/b123d-print==[0-9][0-9.]*/b123d-print==$v/" plugin/pyproject.toml
          sed -i -E "s/b123d-print==[0-9][0-9.]*/b123d-print==$v/" plugin/.mcp.json
          sed -i -E "s/^(  \"version\": )\"[^\"]*\"/\1\"$v\"/" plugin/.claude-plugin/plugin.json
          grep -q "\"version\": \"$v\"" plugin/.claude-plugin/plugin.json
          grep -q "\"b123d-print==$v\"" plugin/pyproject.toml && grep -q "\"b123d-print==$v\"" plugin/.mcp.json
      - name: Lock (retried while PyPI's index catches up with the upload)
        run: |
          for i in $(seq 20); do
            uv lock --directory plugin --refresh-package b123d-print && exit 0
            sleep 30
          done
          exit 1
      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"; branch="release/plugin-pin-$v"
          git diff --quiet && { echo "the plugin already pins $v"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "plugin: run b123d-print $v"
          git push --force origin "$branch"
          gh pr view "$branch" > /dev/null 2>&1 && { echo "PR for $branch exists, updated"; exit 0; }  # a re-run
          gh pr create --base main --head "$branch" --title "plugin: run b123d-print $v" --body "$(cat <<BODY
          Moves the Claude plugin to the release just uploaded to PyPI: \`b123d-print==$v\` and \`version\` in
          \`plugin/pyproject.toml\`, the pin in \`plugin/.mcp.json\`, and \`plugin/uv.lock\` (\`uv lock --directory plugin\`).
          Opened by \`release.yml\` for $GITHUB_REF_NAME.

          A PR opened with GITHUB_TOKEN does not start CI. Close and reopen it to run CI; the run is short,
          because a change that touches only \`plugin/\` runs only the quick job.
          BODY
          )"
