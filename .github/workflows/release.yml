name: Release

# Tag vX.Y.Z (matching pyproject.toml) to publish the PyPI package and the Docker image.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi  # PyPI trusted publisher: owner/repo + workflow release.yml + environment pypi
    permissions:
      id-token: write  # OIDC: no PyPI token stored anywhere
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: The changelog has a dated section for this version
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > /dev/null
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/b123d-print-mcp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    # the GitHub Release page for the tag, text = this version's CHANGELOG.md section;
    # also creates any missing pages for older tags
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_notes.py --backfill
