name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LANG: C  # plain-ASCII locale, so missing encoding="utf-8" shows up here and not on users' machines

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted runners only: on a public repo, self-hosted runners would run fork PRs' code.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces by default; bwrap needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run b123d-print check
      - name: MCP end to end (incl. sandbox escapes)
        run: uv run python tests/mcp_smoke.py
        env:
          B123D_PRINT_EXPECT_SANDBOX: ${{ runner.os == 'Linux' && 'bubblewrap' || 'sandbox-exec' }}
      - name: MCP end to end over HTTP (token, workspaces, parallel builds)
        run: uv run python tests/mcp_smoke.py --http
        env:
          B123D_PRINT_EXPECT_SANDBOX: ${{ runner.os == 'Linux' && 'bubblewrap' || 'sandbox-exec' }}

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: MCP end to end from the built wheel via uvx
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          uv sync --frozen
          B123D_PRINT_EXPECT_SANDBOX=bubblewrap B123D_PRINT_SMOKE_CMD="uvx --from $(ls dist/*.whl) b123d-print-mcp" uv run python tests/mcp_smoke.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker build -t b123d-print-mcp .
      - name: MCP end to end against the container
        run: |
          uv sync --frozen
          # same /tmp path inside and outside, so the test can look at the files the server wrote
          B123D_PRINT_SMOKE_CMD="docker run -i --rm --network none --user $(id -u):$(id -g) -v /tmp:/tmp b123d-print-mcp" \
            uv run python tests/mcp_smoke.py
      - name: The compose example is valid
        run: cd deploy && echo "B123D_PRINT_TOKEN=x" > b123d-print.env && docker compose config -q && rm b123d-print.env
      - name: HTTP mode refuses to start without a token
        run: |
          if docker run --rm -e B123D_PRINT_TRANSPORT=http b123d-print-mcp; then echo "started without a token"; exit 1; fi
      - name: MCP end to end against the container over HTTP
        run: |
          WS=$(mktemp -d)
          TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          docker run -d --name mcp-http -p 127.0.0.1:8000:8000 --user $(id -u):$(id -g) -v "$WS:/work" \
            -e B123D_PRINT_TRANSPORT=http -e B123D_PRINT_TOKEN="$TOKEN" b123d-print-mcp
          for i in $(seq 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' mcp-http); [ "$s" = healthy ] && break; sleep 2
          done
          echo "container health: $s"; [ "$s" = healthy ] || { docker logs mcp-http; exit 1; }
          B123D_PRINT_SMOKE_URL=http://127.0.0.1:8000/mcp B123D_PRINT_SMOKE_TOKEN="$TOKEN" B123D_PRINT_SMOKE_WORKSPACE_DIR="$WS" \
            uv run python tests/mcp_smoke.py || { docker logs mcp-http | tail -50; exit 1; }
          docker rm -f mcp-http
