name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LANG: C  # plain-ASCII locale, so missing encoding="utf-8" shows up here and not on users' machines
  # (on Windows the same job is done by the runner's cp1252 code page for pipes and files)

permissions:
  contents: read

# one run per branch or PR: a new push cancels the run still going for the old one (never on main,
# where every merge gets its full run)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything below runs in parallel; each job does one thing, so the slowest job (not the sum)
  # sets the wait. GitHub-hosted runners only: on a public repo, self-hosted runners would run
  # fork PRs' code.

  changes:
    # A pull request that touches only docs/, root *.md, mkdocs.yml, server.json or plugin/ runs
    # the quick job; the jobs below still start (so every check name reports) but skip their
    # steps. Pushes to main always run everything.
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a PR checks out its merge commit: parent 1 is the base, so HEAD^1..HEAD is the PR
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | sh tools/ci_scope.sh >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  quick:
    # docs-only changes: the docs and config/plugin drift tests and the strict docs build
    needs: changes
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.changes.outputs.full }}
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - if: env.FULL == 'true'
        run: echo 'Code changed, so the full set runs instead of this job'
      - uses: actions/checkout@v7
        if: env.FULL != 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL != 'true'
        with:
          enable-cache: true
      - run: uv sync --frozen
        if: env.FULL != 'true'
      - name: Docs, config and plugin tests
        if: env.FULL != 'true'
        run: uv run pytest -q tests/test_docs.py tests/test_config_and_cli.py
      - name: Docs build
        if: env.FULL != 'true'
        run: uv run mkdocs build --strict

  unit:
    needs: changes
    env:
      FULL: ${{ needs.changes.outputs.full }}  # false: docs-only change, the steps below are skipped
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.FULL != 'true'
        run: echo 'Docs-only change, steps skipped (the quick job runs its tests)'
      - uses: actions/checkout@v7
        if: env.FULL == 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL == 'true'
        with:
          enable-cache: true
      - name: Linux sandbox (bubblewrap)
        if: env.FULL == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces by default; bwrap needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --frozen
        if: env.FULL == 'true'
      - name: Unit tests (parallel)
        if: env.FULL == 'true'
        run: uv run pytest -q -n auto
      - name: Checks on every bundled example
        if: env.FULL == 'true'
        run: uv run b123d-print check

  e2e:
    # the MCP end-to-end test, one job per transport
    needs: changes
    env:
      FULL: ${{ needs.changes.outputs.full }}  # false: docs-only change, the steps below are skipped
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, mode: stdio, flag: "", what: "stdio, incl. sandbox escapes"}
          - {os: ubuntu-latest, mode: http, flag: "--http", what: "HTTP: tokens, workspaces, links, parallel builds"}
          - {os: ubuntu-latest, mode: split, flag: "--split", what: "HTTP with builds in a separate worker process"}
          - {os: ubuntu-latest, mode: ssh-sim, flag: "--ssh", what: "the SSH forced command (sshd simulated)"}
          - {os: macos-latest, mode: stdio, flag: "", what: "stdio, macOS sandbox"}
          - {os: macos-latest, mode: http, flag: "--http", what: "HTTP, macOS sandbox"}
          - {os: windows-latest, mode: stdio, flag: "", what: "stdio, Windows (Job Object + audit hook)"}
          - {os: windows-latest, mode: http, flag: "--http", what: "HTTP, Windows (Ctrl+Break shutdown)"}
    name: e2e (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    steps:
      - if: env.FULL != 'true'
        run: echo 'Docs-only change, steps skipped (the quick job runs its tests)'
      - uses: actions/checkout@v7
        if: env.FULL == 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL == 'true'
        with:
          enable-cache: true
      - name: Linux sandbox (bubblewrap)
        if: env.FULL == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --frozen
        if: env.FULL == 'true'
      - name: MCP end to end (${{ matrix.what }})
        if: env.FULL == 'true'
        run: uv run python tests/mcp_smoke.py ${{ matrix.flag }}
        env:
          B123D_PRINT_EXPECT_SANDBOX: ${{ runner.os == 'Linux' && 'bubblewrap' || runner.os == 'macOS' && 'sandbox-exec' || 'Job Object' }}

  ssh:
    # a real sshd (as the runner user, on localhost) and a key line written by setup-ssh
    needs: changes
    env:
      FULL: ${{ needs.changes.outputs.full }}  # false: docs-only change, the steps below are skipped
    runs-on: ubuntu-latest
    steps:
      - if: env.FULL != 'true'
        run: echo 'Docs-only change, steps skipped (the quick job runs its tests)'
      - uses: actions/checkout@v7
        if: env.FULL == 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL == 'true'
        with:
          enable-cache: true
      - if: env.FULL == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap openssh-server
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo mkdir -p /run/sshd
      - run: uv sync --frozen
        if: env.FULL == 'true'
      - name: MCP end to end over real ssh
        if: env.FULL == 'true'
        run: sh tests/ssh_e2e.sh
        env:
          B123D_PRINT_EXPECT_SANDBOX: bubblewrap

  wheel:
    needs: changes
    env:
      FULL: ${{ needs.changes.outputs.full }}  # false: docs-only change, the steps below are skipped
    runs-on: ubuntu-latest
    steps:
      - if: env.FULL != 'true'
        run: echo 'Docs-only change, steps skipped (the quick job runs its tests)'
      - uses: actions/checkout@v7
        if: env.FULL == 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL == 'true'
        with:
          enable-cache: true
      - run: uv build
        if: env.FULL == 'true'
      - name: MCP end to end from the built wheel via uvx
        if: env.FULL == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          uv sync --frozen
          B123D_PRINT_EXPECT_SANDBOX=bubblewrap B123D_PRINT_SMOKE_CMD="uvx --from $(ls dist/*.whl) b123d-print-mcp" uv run python tests/mcp_smoke.py

  docker:
    needs: changes
    env:
      FULL: ${{ needs.changes.outputs.full }}  # false: docs-only change, the steps below are skipped
    runs-on: ubuntu-latest
    steps:
      - if: env.FULL != 'true'
        run: echo 'Docs-only change, steps skipped (the quick job runs its tests)'
      - uses: actions/checkout@v7
        if: env.FULL == 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL == 'true'
        with:
          enable-cache: true
      - run: docker build -t b123d-print-mcp .
        if: env.FULL == 'true'
      - name: MCP end to end against the container
        if: env.FULL == 'true'
        run: |
          uv sync --frozen
          # same /tmp path inside and outside, so the test can look at the files the server wrote
          B123D_PRINT_SMOKE_CMD="docker run -i --rm --network none --user $(id -u):$(id -g) -v /tmp:/tmp b123d-print-mcp" \
            uv run python tests/mcp_smoke.py

  docker-compose:
    # the two-container HTTP setup: front + network-less worker
    needs: changes
    env:
      FULL: ${{ needs.changes.outputs.full }}  # false: docs-only change, the steps below are skipped
    runs-on: ubuntu-latest
    steps:
      - if: env.FULL != 'true'
        run: echo 'Docs-only change, steps skipped (the quick job runs its tests)'
      - uses: actions/checkout@v7
        if: env.FULL == 'true'
      - uses: astral-sh/setup-uv@v7
        if: env.FULL == 'true'
        with:
          enable-cache: true
      - name: Allow unprivileged user namespaces (the worker runs each job in bubblewrap)
        if: env.FULL == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: docker build -t b123d-print-mcp .
        if: env.FULL == 'true'
      - name: The compose example is valid
        if: env.FULL == 'true'
        run: cd deploy && B123D_PRINT_IMAGE=b123d-print-mcp docker compose config -q
      - name: HTTP mode refuses to start without a token
        if: env.FULL == 'true'
        run: |
          if docker run --rm -e B123D_PRINT_TRANSPORT=http b123d-print-mcp; then echo "started without a token"; exit 1; fi
      - name: MCP end to end over HTTP through the two-container compose setup (front + network-less worker)
        if: env.FULL == 'true'
        working-directory: deploy
        run: |
          uv sync --frozen
          export B123D_PRINT_IMAGE=b123d-print-mcp B123D_PRINT_UID=$(id -u) B123D_PRINT_GID=$(id -g)
          export B123D_PRINT_PARTS=$(mktemp -d) B123D_PRINT_CONFIG=$(mktemp -d)
          TOKEN=$(docker compose run --rm -T b123d-print token add ci --workspace '*')
          docker compose up -d
          front=$(docker compose ps -q b123d-print); worker=$(docker compose ps -q worker)
          for i in $(seq 60); do
            a=$(docker inspect -f '{{.State.Health.Status}}' $front); b=$(docker inspect -f '{{.State.Health.Status}}' $worker)
            [ "$a" = healthy ] && [ "$b" = healthy ] && break; sleep 2
          done
          echo "health: front $a, worker $b"; [ "$a" = healthy ] && [ "$b" = healthy ] || { docker compose logs; exit 1; }
          # the worker, where part scripts run, has no network; the front does
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' $worker)" = none
          if docker compose exec -T worker python -c "import socket; socket.create_connection(('1.1.1.1', 53), 3)"; then
            echo "the worker container reached the network"; exit 1
          fi
          docker compose exec -T worker python -c "import socket; print(socket.if_nameindex())"
          docker compose exec -T b123d-print python -c "import socket; socket.create_connection(('1.1.1.1', 53), 5); print('front: network ok')" \
            || echo "front: no internet from this runner (not needed for the test)"
          # diagnostic: can bubblewrap set up a namespace inside the worker container? a fresh /proc
          # is refused when the container masks parts of /proc, so the worker falls back to an empty
          # /proc; show both so the log says which path is in use (prints the exit code either way)
          echo "bwrap probe (fresh /proc) in worker:"
          docker compose exec -T worker bwrap --unshare-user --ro-bind / / --dev /dev --proc /proc \
            --unshare-net --unshare-pid --die-with-parent true; echo "bwrap --proc exit: $?"
          echo "bwrap probe (empty /proc) in worker:"
          docker compose exec -T worker bwrap --unshare-user --ro-bind / / --dev /dev --tmpfs /proc \
            --unshare-net --unshare-pid --die-with-parent true; echo "bwrap --tmpfs /proc exit: $?"
          # each job runs in its own bubblewrap namespace inside the worker, so one workspace is
          # isolated from the others (the smoke's cross-workspace read must fail); EXPECT_SANDBOX
          # makes the smoke assert the worker really is sandboxed and not silently falling back
          cd .. && B123D_PRINT_SMOKE_URL=http://127.0.0.1:8000/mcp B123D_PRINT_SMOKE_TOKEN="$TOKEN" \
            B123D_PRINT_SMOKE_WORKSPACE_DIR="$B123D_PRINT_PARTS" B123D_PRINT_TOKENS_FILE="$B123D_PRINT_CONFIG/tokens.toml" \
            B123D_PRINT_EXPECT_SANDBOX=bubblewrap \
            B123D_PRINT_SMOKE_SPLIT=1 uv run python tests/mcp_smoke.py \
            || { (cd deploy && docker compose logs worker | tail -120; echo "--- front ---"; docker compose logs b123d-print | tail -40); exit 1; }
          (cd deploy && docker compose logs b123d-print | grep -q " ci POST /mcp ") || { echo "token name not in the log"; exit 1; }
          (cd deploy && docker compose down)
